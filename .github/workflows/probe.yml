name: Probe Zara
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install curl_cffi
      - run: |
          python - <<'EOF'
          from curl_cffi import requests as cr
          API = "https://www.zara.com/az/en/products-details?productIds=578238054&ajax=true"
          for imp in ["chrome", "chrome124", "safari17_0"]:
              try:
                  s = cr.Session(impersonate=imp)
                  s.get("https://www.zara.com/az/en/", timeout=20)
                  r = s.get(API, timeout=20,
                            headers={"Referer": "https://www.zara.com/az/en/",
                                     "X-Requested-With": "XMLHttpRequest"})
                  print(f"{imp}: {r.status_code}  len={len(r.text)}")
                  if r.status_code == 200:
                      print("   sample:", r.text[:150])
              except Exception as e:
                  print(f"{imp}: FAILED {type(e).__name__}")
          EOF

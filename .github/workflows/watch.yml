name: Zara watch

on:
  schedule:
    - cron: "*/15 * * * *"   # GitHub may delay this by a few minutes
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: zara-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python watcher.py
      - name: Save
        run: |
          git config user.name  "zara-watch"
          git config user.email "actions@github.com"
          git add data.json
          git diff --staged --quiet || git commit -m "state [skip ci]"
          git pull --rebase --autostash || true
          git push
